name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION_FILE: src/go.mod

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: src/go.sum

      - name: go vet
        working-directory: src
        run: go vet ./...

      - name: go test
        working-directory: src
        run: go test -v ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: src/go.sum

      - name: 构建
        working-directory: src
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          out="cfddns-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          # -trimpath 去掉本机路径，-s -w 去掉符号表，静态链接无运行时依赖
          go build -trimpath -ldflags "-s -w" -o "../dist/$out" .
          ls -lh "../dist/$out"

      - name: 校验产物可执行（本机能跑的才验证）
        working-directory: dist
        run: |
          set -euo pipefail
          f="cfddns-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            ./"$f" --version
            ./"$f" --help >/dev/null
          fi
          echo "构建产物:"
          ls -l
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cfddns-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/cfddns-*
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 汇总产物
        run: |
          set -euo pipefail
          cd dist
          echo "下载到的文件:"
          ls -l
          sha256sum cfddns-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
